<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Cambiar Contraseña</title>
<style>
body{font-family:Arial;background:#111;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.card{background:white;padding:32px;border-radius:16px;box-shadow:0 10px 30px #0005;width:100%;max-width:400px}
input{width:100%;padding:12px;border-radius:10px;border:1px solid #ccc;margin:8px 0;box-sizing:border-box}
button{width:100%;padding:12px;border-radius:10px;border:none;background:#2563eb;color:white;font-weight:bold;cursor:pointer;margin-top:10px}
h2{margin:0 0 8px 0}
p.hint{font-size:12px;color:#666;margin:0 0 12px 0}
#msg{font-size:12px;min-height:14px;margin-top:8px}
</style></head><body>
<div class="card">
<h2>🔐 Cambio obligatorio</h2>
<p class="hint" id="hint">Por seguridad, debes cambiar tu contraseña temporal antes de continuar.</p>

<div id="actualBox" style="display:none">
  <label style="font-size:12px;font-weight:bold">Contraseña actual</label>
  <input id="actual" type="password" placeholder="Actual">
</div>

<label style="font-size:12px;font-weight:bold">Nueva contraseña</label>
<input id="nueva" type="password" placeholder="Mínimo 6 caracteres">

<label style="font-size:12px;font-weight:bold">Repetir nueva</label>
<input id="confirma" type="password" placeholder="Repite">

<button id="btn" onclick="cambiar()">Guardar y entrar</button>
<p id="msg"></p>
<p style="text-align:center"><a href="/logout" style="font-size:11px;color:#999">Salir</a></p>
</div>
<script>
let params = new URLSearchParams(window.location.search);
let esObligatorio = true; // por defecto si viene de login con debe_cambiar

// detectar si el user ya cambió antes -> pedir actual
async function init(){
  // si no viene marcado como obligatorio, igual probamos sin actual
  // el backend nos dirá si pide actual
  // Si session.debe_cambiar es false, mostramos actualBox
  // truco simple: si no tiene ?next de login obligatorio, asumimos que puede ser cambio voluntario
  // pero el backend manda: si no es obligatorio, exige actual
  // vamos a mostrar actualBox solo si el usuario ya no debe cambiar (cambio voluntario)
  // para saberlo, preguntamos al endpoint? no, más simple: oculto al inicio y si backend dice "actual incorrecta" lo muestro
}
init();

async function cambiar(){
  let msg=document.getElementById('msg');
  let btn=document.getElementById('btn');
  let actual=document.getElementById('actual').value;
  let nueva=document.getElementById('nueva').value.trim();
  let confirma=document.getElementById('confirma').value.trim();

  if(!nueva || nueva.length<6){ msg.style.color='red'; msg.innerText='Mínimo 6 caracteres'; return; }
  if(nueva!==confirma){ msg.style.color='red'; msg.innerText='No coinciden'; return; }

  btn.innerText='Guardando...'; btn.disabled=true; msg.innerText='';

  try{
    let r=await fetch('/api/cambiar-password',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actual,nueva,confirma})});
    let j=await r.json();
    if(!r.ok){ 
      msg.style.color='red'; msg.innerText=j.error;
      // si el error es de actual, mostrar el campo actual
      if(j.error.includes('actual')) document.getElementById('actualBox').style.display='block';
      btn.innerText='Guardar y entrar'; btn.disabled=false;
      return;
    }
    msg.style.color='green'; msg.innerText='✅ Contraseña cambiada';
    setTimeout(()=>{
      let nextUrl=params.get('next');
      if(nextUrl) location=nextUrl;
      else location='/';
    },600);
  }catch(e){
    msg.style.color='red'; msg.innerText='Error conexión';
    btn.innerText='Guardar y entrar'; btn.disabled=false;
  }
}
document.getElementById('confirma').addEventListener('keydown',e=>{if(e.key=='Enter')cambiar()});
</script>
</body></html>
